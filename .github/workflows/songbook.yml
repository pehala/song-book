name: Acceptance

on:
  push:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        run: sudo apt-get install -y gettext libharfbuzz-subset0
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: |
          uv python install
          uv sync --locked --group dev
      - name: Try initializing the repo
        run: |
          make init
      - name: Acceptance check
        run: |
          make commit-acceptance
      - name: Run tests
        run: |
          make test

  browser:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        run: sudo apt-get install -y gettext libharfbuzz-subset0
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: |
          uv python install
          uv sync --locked --group dev
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(uv run playwright --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-shell-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: uv run playwright install --with-deps --only-shell chromium
      - name: Install Chromium system packages
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: uv run playwright install-deps chromium
      - name: Run browser tests
        run: |
          make e2e
      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
