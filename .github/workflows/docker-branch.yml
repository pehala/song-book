name: docker-branch

# Publishes the image of the branch the run is started on, tagged with the branch name
# (characters invalid in a tag become `-`).
on:
  workflow_dispatch:

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=$(echo "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_.\n-' '-' | cut -c1-128)" >> "$GITHUB_OUTPUT"
  build:
    needs: tag
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      tags: ${{ needs.tag.outputs.tag }}
      push: true
