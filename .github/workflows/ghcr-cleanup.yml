name: ghcr-cleanup

# Every push to main moves `latest` and leaves the previous image behind under its commit sha
# tag or untagged; GHCR never garbage-collects those. The newest 10 versions are kept for rollback.
on:
  schedule: [{ cron: "0 3 * * 1" }]
  workflow_dispatch:

jobs:
  prune:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # Safe only because the image is single-arch: a multi-arch `latest` is an
      # untagged index over untagged per-platform manifests, and this would delete them.
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 10
