name: docker

on:
  push: { branches: [main] }
  # A pull request only needs proving to build when the image definition changes; main always builds
  pull_request:
    paths:
      - Containerfile
      - .github/workflows/build-image.yml
      - .github/workflows/docker.yml

# A newer run for the same ref cancels the older one, so merging several pull requests in
# a row leaves a single build of the last main commit
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      tags: latest
      # Pull requests only prove the image builds; main publishes it for podman auto-update
      push: ${{ github.event_name == 'push' }}
