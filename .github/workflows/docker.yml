name: docker

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      tags: latest
      # Pull requests only prove the image builds; main publishes it for podman auto-update
      push: ${{ github.event_name == 'push' }}
