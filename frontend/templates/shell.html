{% load static %}<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ boot.name }}</title>
<link rel="manifest" href="{% url 'frontend:manifest' %}">
{% if boot.icon %}<link rel="icon" type="image/png" href="{{ boot.icon }}">{% endif %}
<script>try{var t=localStorage.getItem("theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.bsTheme=t}catch(e){}</script>
{% for url in stylesheets %}<link rel="stylesheet" href="{{ url }}">
{% endfor %}
{% for url in modules %}<link rel="modulepreload" href="{{ url }}">
{% endfor %}
</head>
<body>
{% include "shell/sprite.svg" %}
<div id="app"><div class="sb-bar"></div><div class="spinner"></div></div>
{{ boot|json_script:"boot" }}
<script type="module" src="{{ entry }}"></script>
</body>
</html>
