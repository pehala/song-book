{% load static %}
{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}

<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <title>{% trans "Not found" %}</title>
    {% if request.tenant.icon %}<link rel="shortcut icon" type="image/png" href="{{ request.tenant.icon.url }}"/>{% endif %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script>try{var t=localStorage.getItem("theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.bsTheme=t}catch(e){}</script>
    <link rel="stylesheet" type="text/css" href="{% static 'icons/css/songs.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'styles.css' %}">
    {% block extra_head %} {% endblock %}
</head>
<body>
    <div class="container mt-3 mb-3 pb-3">
        <h1 class="mt-2">{% block header %}{% endblock %}</h1>
        <hr>
        <p>
            {% block body %}{% endblock %}
        </p>
    </div>
</body>
</html>
