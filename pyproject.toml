[project]
name = "chords"
version = "0.1.0"
description = "Song book written in Django, supporting offline viewing"
readme = "README.md"
authors = [{ name = "Petr Hála", email = "phala@sprtovo.eu" }]
requires-python = ">=3.12"

dependencies = [
  "django>=6.0.6",
  "django_bootstrap5",
  "django-debug-toolbar",
  "django-markdownx>=4.0.11",
  "django-redis",
  "huey",
  "django-weasyprint",
  "weasyprint>=68.1",
  "Pillow",
  "mistune>=3.2.1",
  "django-polymorphic",
]

[dependency-groups]
production = [
  "psycopg[binary,pool]>=3.3.4",
  "gunicorn",
  "gevent",
]
dev = [
  "playwright>=1.64.1",
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
  "pytest-django>=4.12.0",
  "pytest-playwright>=0.10.0",
  "pytest-xdist>=3.8.0",
  "ruff",
]

[tool.uv]
default-groups = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "chords.settings.test"
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-m 'not e2e'"
markers = [
  "e2e: drives the reader in a real browser; run with `make e2e`, needs `playwright install chromium`",
  "slow: marks tests as slow (real WeasyPrint rendering); deselect with -m 'not slow'",
]

[tool.coverage.run]
source = ["analytics", "backend", "category", "chords", "frontend", "pdf", "tenants"]
branch = true
omit = [
  "*/migrations/*",
  "*/apps.py",
  "chords/settings/development.py",
  "chords/settings/production.py",
  "chords/wsgi.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if settings.DEBUG:",
  "@(abc\\.)?abstractmethod",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
extend-select = ["E", "F", "I", "B", "UP", "SIM", "PL", "D"]
# D105/D107: `__str__` and `__init__` are covered by the class docstring; D106: Django's `Meta` classes
ignore = ["PLR2004", "RUF012", "D105", "D106", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"manage.py" = ["PLC0415"]
"**/migrations/*" = ["D"]
"tests/**/__init__.py" = ["D104"]
