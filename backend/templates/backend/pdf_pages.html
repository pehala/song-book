{% load i18n %}
<div class="fw-bold small {{ classes }}" data-pdf-pages data-fits="{% trans 'Fits on one page of the PDF' %}" data-close="{% trans 'Close to the end of the page in the PDF, check it there' %}" data-overflows="{% trans 'Might not fit on one page of the PDF' %}" role="status" hidden>
  <span class="pdf-pages-icon" aria-hidden="true"></span>
  <span class="pdf-pages-label"></span>
  <div class="pdf-pages-cramped text-warning-emphasis" hidden>
    <span aria-hidden="true">⚠</span> {% trans "Might look cramped in three columns, many lines wrap there" %}
  </div>
</div>
