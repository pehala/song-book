# Songbook behind nginx, talking to gunicorn over a unix socket. See docs/DEPLOY.md.
# Install to /etc/nginx/conf.d/songbook.conf and adjust server_name, certificates and the
# /home/songbook paths (the home of the user running the quadlets).
#
# The brotli* directives need ngx_brotli (Debian/Ubuntu: libnginx-mod-http-brotli-filter and
# libnginx-mod-http-brotli-static). Without the module, delete them; gzip keeps working.

upstream songbook {
    server unix:/home/songbook/nginx/gunicorn/gunicorn.sock fail_timeout=0;
}

# ManifestStaticFilesStorage names files name.<12 hex chars>.ext; those never change and can be
# cached forever. The un-fingerprinted copies collectstatic also writes may change between releases.
map $uri $songbook_static_cache_control {
    "~\.[0-9a-f]{12}\.[^./]+$"  "public, max-age=31536000, immutable";
    default                     "public, max-age=3600";
}

# Requests for hostnames that are not a tenant never reach Django (it would reject them anyway).
# Drop this block if the host already has a default_server.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name songs.example.org camp.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # Every tenant hostname; nginx passes Host through and Django picks the tenant from it
    server_name songs.example.org camp.example.org;

    ssl_certificate     /etc/letsencrypt/live/songs.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/songs.example.org/privkey.pem;

    client_max_body_size 10m;

    # On-the-fly compression of what gunicorn returns: HTML pages and, above all, the songs JSON
    # (/all/data, /categories/<slug>/data). text/html is always on the gzip/brotli type list.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        application/json application/javascript text/css text/plain image/svg+xml;

    brotli            on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types      application/json application/javascript text/css text/plain image/svg+xml;

    location /static/ {
        alias /home/songbook/nginx/static/;
        # Serve the .br/.gz files compressed at image build time; never compress statics per request
        brotli_static on;
        gzip_static   on;
        add_header Cache-Control $songbook_static_cache_control always;
        access_log off;
    }

    location /media/ {
        alias /home/songbook/nginx/media/;
        # PDFs are regenerated in place under the same name, so browsers must revalidate
        add_header Cache-Control "no-cache" always;
    }

    location / {
        proxy_pass http://songbook;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # gunicorn threads must not wait on slow clients: nginx reads the whole response
        # and trickles it out itself. Large enough buffers keep the songs JSON in memory.
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 32 32k;
        proxy_read_timeout 90s;
    }
}
