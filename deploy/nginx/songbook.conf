# One songbook instance behind nginx, talking to gunicorn over a unix socket. See deploy/DEPLOY.md.
# Per instance: sed s/INSTANCE/camp/g songbook.conf > /etc/nginx/conf.d/songbook-camp.conf, then adjust
# server_name, certificates and the /home/songbook paths (the home of the user running the quadlets).
# songbook-common.conf (the static cache map and the default server) is installed once.
#
# The brotli* directives need ngx_brotli (Debian/Ubuntu: libnginx-mod-http-brotli-filter and
# libnginx-mod-http-brotli-static). Without the module, delete them; gzip keeps working.

upstream songbook-INSTANCE {
    server unix:/home/songbook/nginx/INSTANCE/gunicorn/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name songs.example.org camp.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # Every tenant hostname; nginx passes Host through and Django picks the tenant from it
    server_name songs.example.org camp.example.org;

    ssl_certificate     /etc/letsencrypt/live/songs.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/songs.example.org/privkey.pem;

    client_max_body_size 10m;

    # On-the-fly compression of what gunicorn returns: HTML pages and, above all, the songs JSON
    # (/all/data, /categories/<slug>/data), service_worker.js and the web app manifest. text/html is always on the
    # gzip/brotli type list.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        application/json application/manifest+json application/javascript text/css text/plain image/svg+xml;

    brotli            on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types      application/json application/manifest+json application/javascript text/css text/plain image/svg+xml;

    location /static/ {
        alias /home/songbook/nginx/INSTANCE/static/;
        # Serve the .br/.gz files compressed at image build time; never compress statics per request
        brotli_static on;
        gzip_static   on;
        add_header Cache-Control $songbook_static_cache_control always;
        access_log off;
    }

    location /media/ {
        alias /home/songbook/nginx/INSTANCE/media/;
        # PDFs are regenerated in place under the same name, so browsers must revalidate
        add_header Cache-Control "no-cache" always;
    }

    location / {
        proxy_pass http://songbook-INSTANCE;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # gunicorn threads must not wait on slow clients: nginx reads the whole response
        # and trickles it out itself. Large enough buffers keep the songs JSON in memory.
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 32 32k;
        proxy_read_timeout 90s;
    }
}
