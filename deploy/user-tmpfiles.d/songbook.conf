# One file per instance: sed s/INSTANCE/camp/g songbook.conf > ~/.config/user-tmpfiles.d/songbook-camp.conf,
# then: systemd-tmpfiles --user --create
# %t is $XDG_RUNTIME_DIR, %h the home directory of the user running the quadlets.

# PostgreSQL and Redis sockets, reachable by this user's containers only
d %t/songbook                    0700 - - -
d %t/songbook/INSTANCE           0700 - - -
d %t/songbook/INSTANCE/postgres  0700 - - -
d %t/songbook/INSTANCE/redis     0700 - - -

# What the host nginx reads: the gunicorn socket, static files and generated PDFs.
# nginx additionally needs search (x) permission on the home directory, see docs/DEPLOY.md.
d %h/nginx                   0755 - - -
d %h/nginx/INSTANCE          0755 - - -
d %h/nginx/INSTANCE/gunicorn 0755 - - -
d %h/nginx/INSTANCE/static   0755 - - -
d %h/nginx/INSTANCE/media    0755 - - -
