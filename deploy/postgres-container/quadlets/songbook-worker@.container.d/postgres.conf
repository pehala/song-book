# PostgreSQL in a container: start after it and give the unit its password; the socket mount is changed with sed. Install as
# ~/.config/containers/systemd/songbook/songbook-worker@.container.d/postgres.conf
[Unit]
Requires=songbook-postgres@%i.service
After=songbook-postgres@%i.service

[Container]
Secret=songbook-db-password-%i,type=env,target=POSTGRES_PASSWORD
